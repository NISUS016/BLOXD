[package]
name = "bloxd-core"
version = "0.1.0"
edition = "2021"

[dependencies]
chrono = { version = "0.4", features = ["serde"] }
notify = "8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
specta = { version = "=2.0.0-rc.28", features = ["derive"] }
tempfile = "3"
thiserror = "2"
